name: 例行提醒

on:
  schedule:
    # GitHub 的免費排程常延遲 1~3 小時，且偶爾會跳過整次。
    # 因此提早排、並安排多個時段當保險；程式本身有「同一天只發一次」
    # 的防重複機制（lastSent），所以多跑幾次不會重複通知。
    - cron: '0 22 * * *'   # 22:00 UTC = 台北 06:00
    - cron: '0 23 * * *'   # 台北 07:00
    - cron: '0 0 * * *'    # 台北 08:00
    - cron: '0 1 * * *'    # 台北 09:00
    - cron: '0 3 * * *'    # 台北 11:00（保險）
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 檢查並發送今天到期的提醒
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_USE_SSL: ${{ secrets.SMTP_USE_SSL }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        run: python scripts/send_reminders.py
